name: gestion_salud
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.4.0
  firebase_auth: ^5.1.0
  firebase_core: ^3.15.2
  firebase_storage: ^12.4.10
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1
  intl: ^0.19.0
  geolocator: ^14.0.2
  url_launcher: ^6.3.0
  pdf: ^3.11.0
  printing: ^5.13.0
  mobile_scanner: ^5.2.3
  permission_handler: ^11.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
